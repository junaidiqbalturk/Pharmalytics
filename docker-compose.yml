services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: Pharmalytics
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env before starting Docker}
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: pharmalytics
      DB_USERNAME: pharmalytics
      DB_PASSWORD: pharmalytics
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      API_VERSION: 1.0.0
      SANCTUM_TOKEN_EXPIRATION: 480
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - /var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: Pharmalytics
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env before starting Docker}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: pharmalytics
      DB_USERNAME: pharmalytics
      DB_PASSWORD: pharmalytics
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      API_VERSION: 1.0.0
      SANCTUM_TOKEN_EXPIRATION: 480
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - /var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_started
    command: php artisan horizon

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pharmalytics
      POSTGRES_USER: pharmalytics
      POSTGRES_PASSWORD: pharmalytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmalytics -d pharmalytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  vendor:
  frontend_node_modules:
